{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-transmission-jellyfin-data
  namespace: {{ .Release.Namespace }}
spec:
  storageClassName: {{ .Values.persistence.data.storageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-transmission-config
  namespace: {{ .Release.Namespace }}
spec:
  storageClassName: {{ .Values.persistence.transmission.storageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.transmission.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-jellyfin-config
  namespace: {{ .Release.Namespace }}
spec:
  storageClassName: {{ .Values.persistence.jellyfinConfig.storageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.jellyfinConfig.size }}
---
{{- if .Values.persistence.jellyfinCache.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-jellyfin-cache
  namespace: {{ .Release.Namespace }}
spec:
  storageClassName: {{ .Values.persistence.jellyfinCache.storageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.jellyfinCache.size }}
{{- end }}
{{- end }}