{{- if .Values.persistence.config.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.persistence.config.annotations }}
    {{- toYaml .Values.persistence.config.annotations | nindent 4}}
    {{- end }}
  labels:
    app.kubernetes.io/name: transmission
    app.kubernetes.io/component: config
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    {{- if .Values.persistence.config.labels }}
    {{- toYaml .Values.persistence.config.labels | nindent 4}}
    {{- end }}
spec:
  accessModes:
  {{- range $mode := .Values.persistence.config.accessModes }}
    - {{ $mode }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.config.size }} 
  storageClassName: {{ .Values.persistence.config.storageClass }}
{{- end }}
---
{{- if .Values.persistence.data.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.persistence.data.annotations }}
    {{- toYaml .Values.persistence.data.annotations | nindent 4}}
    {{- end }}
  labels:
    app.kubernetes.io/name: transmission
    app.kubernetes.io/component: data
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    {{- if .Values.persistence.data.labels }}
    {{- toYaml .Values.persistence.data.labels | nindent 4}}
    {{- end }}
spec:
  accessModes:
  {{- range $mode := .Values.persistence.data.accessModes }}
    - {{ $mode }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }} 
  storageClassName: {{ .Values.persistence.data.storageClass }}
{{- end }}
