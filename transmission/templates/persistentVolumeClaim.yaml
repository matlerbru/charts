    {{- toYaml .Values.data.persistence.annotations | nindent 4}}
    {{- end }}
  labels:
    app.kubernetes.io/name: transmission
    app.kubernetes.io/component: data
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    {{- if .Values.data.persistence.labels }}
    {{- toYaml .Values.data.persistence.labels | nindent 4}}
    {{- end }}
spec:
  accessModes:
  {{- range $mode := .Values.data.persistence.accessModes }}
    - {{ $mode }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.data.persistence.size }} 
  storageClassName: {{ .Values.data.persistence.storageClass }}
{{- end }}
