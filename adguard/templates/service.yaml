{{- if .Values.service.clusterIp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.service.clusterIp.annotations }}
    {{- toYaml .Values.service.clusterIp.annotations | nindent 4 }}
    {{- end }}
  labels:
    app.kubernetes.io/name: adguard
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    {{- if .Values.service.clusterIp.abels }}
    {{- toYaml .Values.service.clusterIp.labels | nindent 4 }}
    {{- end }}
spec:
  selector:
    app.kubernetes.io/name: adguard
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - protocol: TCP
    port: 80
    targetPort: http
    name: http
  - protocol: TCP
    port: 3000
    targetPort: http-initial
    name: http-initial
---
{{- end }}
{{- if .Values.service.loadBalancer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dns
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.service.loadBalancer.annotations }}
    {{- toYaml .Values.service.loadBalancer.annotations | nindent 4 }}
    {{- end }}
  labels:
    app.kubernetes.io/name: adguard
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    {{- if .Values.service.loadBalancer.labels }}
    {{- toYaml .Values.service.loadBalancer.labels | nindent 4 }}
    {{- end }}
spec:
  selector:
    app.kubernetes.io/name: adguard
    app.kubernetes.io/instance: {{ .Release.Name }}
  type: LoadBalancer
  ports:
  - name: dns-udp
    protocol: UDP
    port: 53
    targetPort: dns-udp
  - name: dns-tcp
    protocol: TCP
    port: 53
    targetPort: dns-tcp
{{- end }}
