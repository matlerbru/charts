apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.deployment.annotations }}
    {{- toYaml .Values.deployment.annotations | nindent 4}}
    {{- end }}
  labels:
    app.kubernetes.io/name: adguard
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    {{- if .Values.deployment.labels }}
    {{- toYaml .Values.deployment.labels | nindent 4}}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- if .Values.deployment.podAnnotations }}
        {{- toYaml .Values.deployment.podAnnotations | nindent 8}}
        {{- end }}
      labels:
        app.kubernetes.io/name: adguard
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion }}
        {{- if .Values.deployment.podLabels }}
        {{- toYaml .Values.deployment.podLabels | nindent 8}}
        {{- end }}
    spec:
      {{- if .Values.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.deployment.nodeSelector | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.deployment.podSecurityContext | nindent 8 }}
      containers:
      - name: adguard
        image: adguard/adguardhome:{{ .Chart.AppVersion }}
        securityContext:
          {{- toYaml .Values.deployment.securityContext | nindent 10 }}
        ports:
        - name: http
          containerPort: 80
        - name: http-initial 
          containerPort: 3000
        - name: dns-tcp
          containerPort: 53
          protocol: TCP
        - name: dns-udp
          containerPort: 53
          protocol: UDP
        volumeMounts:
        {{- if .Values.persistence.work.enabled }}
        - name: work
          mountPath: /opt/adguardhome/work
        {{- end }}
        {{- if .Values.persistence.config.enabled }}
        - name: config
          mountPath: /opt/adguardhome/conf
        {{- end }}
        {{- if .Values.deployment.resources }}
        resources:
        {{- toYaml .Values.deployment.resources | nindent 10 }}
        {{- end }}
        {{- if .Values.deployment.startupProbe }}
        startupProbe:
        {{- toYaml .Values.deployment.startupProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.deployment.readinessProbe }}
        readinessProbe:
        {{- toYaml .Values.deployment.readinessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.deployment.livenessProbe }}
        livenessProbe:
        {{- toYaml .Values.deployment.livenessProbe | nindent 10 }}
        {{- end }}
      {{- if (and (hasKey .Values.deployment "tolerations") (gt 0 (len .Values.deployment.tolerations))) }}
      tolerations:
      {{- .Values.deployment.tolerations | toYaml | nindent 8 }}
      {{- end }}
      volumes:
      {{- if .Values.persistence.work.enabled }}
      - name: work
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-work
      {{- end }}
      {{- if .Values.persistence.config.enabled }}
      - name: config
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-config
      {{- end }}
