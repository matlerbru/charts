apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      containers:
      - name: {{ .Release.Name }}
        image: acockburn/appdaemon:latest
        env:
        - name: HA_URL
          value: {{ .Values.homeAssistant.url }}:{{ default "8123" .Values.homeAssistant.port }}
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.homeAssistant.token.secret }}
              key: {{ .Values.homeAssistant.token.key }}
      {{- if .Values.persistence.enabled }}
        volumeMounts:
        - name: data  
          mountPath: /mosquitto/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
      {{- end }}
---