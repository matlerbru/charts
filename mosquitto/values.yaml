
deployment:
  labels:
  annotations:
  podLabels: {}
  podAnnotations: {}

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  nodeSelector: {}
  tolerations: []

  startupProbe:
    tcpSocket:
      port: mqtt
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 12

  readinessProbe:
    tcpSocket:
      port: mqtt
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

  livenessProbe:
    tcpSocket:
      port: mqtt
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

service:
  clusterIp:
    enabled: true
    labels: []
    annotations: []

  loadBalancer:
    enabled: false
    labels: []
    annotations: []

config:
  allowAnonymous: true
  annotations: {}
  labels: {}
  additionalConfig: ""

persistence:
  enabled: false
  storageClass: ""
  size: 1Gi
  accessModes:
  - ReadWriteOnce
  annotations: {}
  labels: {}

  ## add exporter

