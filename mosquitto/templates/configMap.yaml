apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}
  annotations:
    {{- if .Values.configMap.annotations }}
    {{- toYaml .Values.configMap.annotations | nindent 4 }}
    {{- end }}
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    {{- if .Values.configMap.labels }}
    {{- toYaml .Values.configMap.labels | nindent 4 }}
    {{- end }}
data:
  mosquitto.conf: |

    listener 1883
    user mosquitto

    log_dest stdout

    allow_anonymous {{ .Values.config.allowAnonymous }}

    {{- .Values.persistence.enabled }}
      persistence true
      persistence_location mosquitto/data/
    {{- end }}

    {{- .Values.config.additionalConfig | nindent 4 }}
