apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.unifiController.deployment.annotations }}
    {{- toYaml .Values.unifiController.deployment.annotations | nindent 4}}
    {{- end }}
  labels:
    app.kubernetes.io/name: unifi-controller
    app.kubernetes.io/component: unifi-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    {{- if .Values.unifiController.deployment.labels }}
    {{- toYaml .Values.unifiController.deployment.labels | nindent 4}}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unifi-controller
      app.kubernetes.io/component: unifi-controller
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- if .Values.unifiController.deploymentpodAnnotations }}
        {{- toYaml .Values.unifiController.deploymentpodAnnotations | nindent 8}}
        {{- end }}
      labels:
        app.kubernetes.io/name: unifi-controller
        app.kubernetes.io/component: unifi-controller
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion }}
        {{- if .Values.unifiController.deploymentpodLabels }}
        {{- toYaml .Values.unifiController.deploymentpodLabels | nindent 8}}
        {{- end }}
    spec:
      {{- if .Values.unifiController.deploymentnodeSelector }}
      nodeSelector:
        {{- toYaml .Values.unifiController.deploymentnodeSelector | nindent 8 }}
      {{- end }}
      containers:
      - name: unifi-controller
        image: lscr.io/linuxserver/unifi-network-application:{{ .Chart.AppVersion }}
        ports:
        - name: https
          containerPort: 8443
        - name: http
          containerPort: 8080
        - name: stun
          containerPort: 3478
        - name: ap-discovery
          containerPort: 10001
        - name: l2-network-discovery
          containerPort: 1900
        - name: mobile-throughput-test
          containerPort: 6789
        - name: remote-syslog
          containerPort: 5514
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: DK
        - name: MONGO_USER
          value: root
        - name: MONGO_PASS
          valueFrom:
            secretKeyRef:
              {{- if .Values.secret.existingkey.enabled }}
              name: {{ .Values.secret.existingkey.name }}
              {{- else }}
              name: {{ .Release.Name }}-mongo
              {{- end }}
              key: mongo-initdb-root-password
        - name: MONGO_HOST
          value: {{ .Release.Name }}-mongo
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_DBNAME
          value: unifi
        - name: MONGO_AUTHSOURCE
          value: admin
        resources:
        {{- toYaml .Values.unifiController.deployment.resources | nindent 10 }}
        startupProbe:
        {{- toYaml .Values.unifiController.deployment.startupProbe | nindent 10 }}
        readinessProbe:
        {{- toYaml .Values.unifiController.deployment.readinessProbe | nindent 10 }}
        livenessProbe:
        {{- toYaml .Values.unifiController.deployment.livenessProbe | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/unifi
        - name: config
          mountPath: /config
      {{- if hasKey .Values.unifiController.deployment "tolerations" }}
      tolerations:
      {{- .Values.unifiController.deployment.tolerations | toYaml | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-permissions
          image: busybox:{{ .Values.unifiController.deployment.initContainer.image.tag }}
          command:
            - sh
            - "-c"
            - |
              chown 1000:1000 /var/lib/unifi
              chmod 755 /var/lib/unifi
              chown 1000:1000 /config
              chmod 755 /config
          volumeMounts:
          - name: data
            mountPath: /var/lib/unifi
          - name: config
            mountPath: /config
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-config
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mongo
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.mongo.deployment.annotations }}
    {{- toYaml .Values.mongo.deployment.annotations | nindent 4}}
    {{- end }}
  labels:
    app.kubernetes.io/name: unifi-controller
    app.kubernetes.io/component: mongo
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.mongo.deployment.image.tag }}
    {{- if .Values.mongo.deployment.labels }}
    {{- toYaml .Values.mongo.deployment.labels | nindent 4}}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unifi-controller
      app.kubernetes.io/component: mongo
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- if .Values.mongo.deployment.podAnnotations }}
        {{- toYaml .Values.mongo.deployment.podAnnotations | nindent 8}}
        {{- end }}
      labels:
        app.kubernetes.io/name: unifi-controller
        app.kubernetes.io/component: mongo
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Values.mongo.deployment.image.tag }}
        {{- if .Values.mongo.deployment.podLabels }}
        {{- toYaml .Values.mongo.deployment.podLabels | nindent 8}}
        {{- end }}
    spec:
      {{- if .Values.mongo.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.mongo.deployment.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
      - name: mongo
        image: mongo:{{ .Values.mongo.deployment.image.tag }}
        ports:
        - name: http
          containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: root
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              {{- if .Values.secret.existingkey.enabled }}
              name: {{ .Values.secret.existingkey.name }}
              {{- else }}
              name: {{ .Release.Name }}-mongo
              {{- end }}
              key: mongo-initdb-root-password
        - name: MONGO_USER
          value: unifi
        - name: MONGO_PASS
          valueFrom:
            secretKeyRef:
              {{- if .Values.secret.existingkey.enabled }}
              name: {{ .Values.secret.existingkey.name }}
              {{- else }}
              name: {{ .Release.Name }}-mongo
              {{- end }}
              key: mongo-pass
        - name: MONGO_DBNAME
          value: unifi
        - name: MONGO_AUTHSOURCE
          value: admin
        resources:
        {{- toYaml .Values.mongo.deployment.resources | nindent 10 }}
        startupProbe:
        {{- toYaml .Values.mongo.deployment.startupProbe | nindent 10 }}
        readinessProbe:
        {{- toYaml .Values.mongo.deployment.readinessProbe | nindent 10 }}
        livenessProbe:
        {{- toYaml .Values.mongo.deployment.livenessProbe | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /data/db
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/init-mongo.sh:ro
          subPath: init-mongo.sh
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
      securityContext:
        fsGroup: 1001
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-mongo
      - name: init-script
        configMap:
          name: mongo-init-script