
unifiController:

  deployment:

    labels: {}
    annotation: {}

    podLabels: {}
    podAnnotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

    nodeSelector: {}
    tolerations: []

    startupProbe:
    readinessProbe:
    livenessProbe:

    initContainer:
      image:
        tag: latest

  service:
    labels: {}
    annotations: {}

mongo:

  deployment:

    image:
      tag: 4.4

    labels: {}
    annotation: {}

    podLabels: {}
    podAnnotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

    nodeSelector: {}
    tolerations: []

    startupProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - |
            mongo --quiet \
              -u "$MONGO_USER" \
              -p "$MONGO_PASS" \
              --authenticationDatabase "$MONGO_AUTHSOURCE" \
              --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 30

    readinessProbe:
      tcpSocket:
        port: 27017
      periodSeconds: 5
      failureThreshold: 3

    livenessProbe:
      tcpSocket:
        port: 27017
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6

  service:
    labels: {}
    annotations: {}

configMap:
  labels: {}
  annotations: {}

persistence:
  config:
    storageClass: ""
    size: 1Gi
    accessModes:
    - ReadWriteOnce
    annotations: {}
    labels: {}
  data:
    storageClass: ""
    size: 1Gi
    accessModes:
    - ReadWriteOnce
    annotations: {}
    labels: {}
  mongo:
    storageClass: ""
    size: 1Gi
    accessModes:
    - ReadWriteOnce
    annotations: {}
    labels: {}

secret:
  existingkey:
    enabled: false
    name: ""
  labels: {}
  annotations: {}
